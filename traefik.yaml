version: "3.9"
services:
  traefik:
    image: traefik:v3.4.1
    command:
      # Configure Swarm provider
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=traefik_public"
      # Enable HTTP and HTTPS entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP to HTTPS redirection (optional, kept for other services)
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Let's Encrypt configuration (staging for testing)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=user@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      # Enable API and Dashboard
      - "--api=true"
      - "--api.dashboard=true"
      # Logging configuration
      - "--log.level=DEBUG"
      - "--log.format=json"
      - "--accesslog=true"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        # Enable Traefik for this service
        - "traefik.enable=true"
        # Dashboard router for HTTP (port 80)
        - "traefik.http.routers.dashboard-http.rule=Host(`dashboard.my.lan`)"
        - "traefik.http.routers.dashboard-http.entrypoints=web"
        - "traefik.http.routers.dashboard-http.service=api@internal"
        - "traefik.http.routers.dashboard-http.middlewares=dashboard-auth"
        # Dashboard router for HTTPS (port 443)
        - "traefik.http.routers.dashboard-https.rule=Host(`dashboard.my.lan`)"
        - "traefik.http.routers.dashboard-https.entrypoints=websecure"
        - "traefik.http.routers.dashboard-https.service=api@internal"
        - "traefik.http.routers.dashboard-https.tls=true"
        - "traefik.http.routers.dashboard-html-https.tls.certresolver=letsencrypt"
        - "traefik.http.routers.dashboard-https.middlewares=dashboard-auth"
        # Basic auth middleware
        - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$d.fYrZsU$$MjCUMzN4bachTVT6zahww1"
        # Required dummy-svc label
        - "traefik.http.services.dummy-svc.loadbalancer.server.port=9999"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "vol_certificates:/etc/traefik/letsencrypt"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    networks:
      - traefik_public

volumes:
  vol_shared:
    external: false
    name: volume_swarm_shared
  vol_certificates:
    external: false
    name: volume_swarm_certificates

networks:
  traefik_public:
    external: true
    name: traefik_public
